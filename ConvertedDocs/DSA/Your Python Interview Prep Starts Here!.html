<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Python Interview Prep Starts Here!</title>
<link rel="stylesheet" href="../assets/learning-hub-shared.css">
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --text: #151922;
  --muted: #586173;
  --border: #dce3ec;
  --accent: #2459d6;
  --shadow: 0 14px 36px rgba(31, 42, 63, .1);
}
html.dark {
  --bg: #101319;
  --surface: #181d27;
  --text: #edf1f7;
  --muted: #a2acbc;
  --border: #303849;
  --accent: #7ca2ff;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  padding: 40px 20px;
  line-height: 1.6;
}
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  background: var(--surface);
  padding: 40px;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
}
.btn-back {
  padding: 10px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-decoration: none;
  color: var(--text);
  font-weight: bold;
}
h1, h2, h3, h4, h5, h6 { margin-top: 1.5em; }
pre {
  background: #1e1e1e;
  color: #fff;
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
}
code { font-family: monospace; }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
}
th, td {
  border: 1px solid var(--border);
  padding: 10px;
  text-align: left;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a href="../library.html" class="btn-back">Back to Library</a>
  </div>
  <div class="content">
    
  </div>
</div>
</body>
</html>
