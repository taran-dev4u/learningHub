<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auto-Me">
<title>Auto-Me</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232a78d6'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='system-ui' font-weight='700' fill='%23fff'>A</text></svg>">
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --raise:0 1px 2px rgba(11,11,11,.05),0 6px 20px rgba(11,11,11,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --raise:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(72px + var(--safe-b))}
a{color:var(--s1)}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--grid)}
.hrow{max-width:820px;margin:0 auto;padding:10px 14px;display:flex;
  align-items:center;gap:14px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:auto;
  display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--good);display:block}
.brand i.off{background:var(--muted)}
.brand i.err{background:var(--crit)}
.kpi{text-align:right;line-height:1.1}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.iconbtn{border:1px solid var(--ring);background:var(--card);color:var(--ink);
  width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer;
  display:grid;place-items:center;flex:none}

/* ---------- bottom nav ---------- */
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);
  border-top:1px solid var(--grid);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:var(--safe-b)}
nav.bot button{background:none;border:0;padding:9px 4px 11px;font:inherit;
  font-size:10.5px;color:var(--muted);cursor:pointer;display:grid;gap:3px;
  justify-items:center;letter-spacing:.03em}
nav.bot button b{font-size:19px;line-height:1;font-weight:400}
nav.bot button[aria-selected=true]{color:var(--s1);font-weight:600}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--ring);border-radius:14px;
  padding:15px;margin:12px 0;box-shadow:var(--raise)}
.card h2{margin:0 0 3px;font-size:16px;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:var(--grid);color:var(--ink2)}
.note{color:var(--ink2);font-size:13.5px;margin:2px 0 10px}
.btn{border:1px solid var(--ring);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--s1);border-color:transparent;color:#fff;font-weight:600}
.btn.ok{background:var(--good);border-color:transparent;color:#fff;font-weight:600}
.btn.wide{width:100%}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
input,select,textarea{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--ring);background:var(--card);color:var(--ink);width:100%}

/* ---------- tier switch ---------- */
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--grid);
  padding:3px;border-radius:11px}
.tiers button{border:0;background:none;padding:9px 2px;border-radius:9px;
  font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.tiers button[aria-pressed=true]{background:var(--card);color:var(--ink);
  font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ---------- progress ---------- */
.tr{height:10px;background:var(--grid);border-radius:4px;overflow:hidden;display:flex}
.fl{height:100%}
.fl+.fl{box-shadow:-2px 0 0 var(--card)}
.bar{display:grid;grid-template-columns:1fr;gap:5px;margin:11px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);gap:10px}
.bar .lb b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}

/* ---------- item ---------- */
.grp{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin:16px 0 7px;line-height:1.35}
.it{border:1px solid var(--grid);border-radius:12px;margin:9px 0;overflow:hidden;
  background:var(--card)}
.it.done{opacity:.5}
.ihead{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:12px 13px;
  align-items:start;cursor:pointer}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--axis);
  display:grid;place-items:center;flex:none;background:transparent;
  font-size:15px;color:transparent;margin-top:1px;transition:.12s}
.it.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.ti{font-size:15.5px;font-weight:600;line-height:1.4}
.it.done .ti{text-decoration:line-through}
.de{font-size:13.5px;color:var(--ink2);margin-top:3px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;
  letter-spacing:.04em;margin-right:5px;vertical-align:1.5px;white-space:nowrap}
.t-MIN{background:var(--crit);color:#fff}.t-TGT{background:var(--s1);color:#fff}
.t-STR{background:var(--grid);color:var(--ink2)}
.t-E{background:rgba(12,163,12,.18);color:var(--good)}
.t-M{background:rgba(250,178,25,.2);color:#8a6100}
:root[data-theme=dark] .t-M{color:var(--warn)}
.t-H{background:rgba(208,59,59,.18);color:var(--crit)}
.ibody{padding:0 13px 13px;display:none}
.it.open .ibody{display:block}
.acts{display:flex;gap:7px;padding:0 13px 12px;flex-wrap:wrap}

/* references */
.refs{margin-top:10px}
.refs h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:14px 0 7px;font-weight:700}
.ref{display:block;border:1px solid var(--grid);border-radius:10px;padding:10px 12px;
  margin:6px 0;text-decoration:none;color:inherit;background:var(--bg)}
.ref:active{border-color:var(--s1)}
.ref .rt{font-size:14px;font-weight:600;color:var(--s1);line-height:1.35}
.ref .rw{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.ref .rk{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:700;margin-left:6px}
.ref.primary{border-color:var(--s1);background:color-mix(in oklab,var(--s1) 8%,var(--card))}

/* lesson */
.lesson{margin-top:12px;font-size:14.5px;line-height:1.68}
.lesson p{margin:0 0 9px}
.lesson ul,.lesson ol{margin:0 0 9px;padding-left:20px}
.lesson li{margin:3px 0}
.lesson code{background:var(--bg);border:1px solid var(--grid);padding:1px 5px;
  border-radius:5px;font-size:13px}
.lesson pre{background:#000;color:#e8e8e8;border-radius:10px;padding:12px;
  overflow-x:auto;font-size:12.5px;line-height:1.5;-webkit-overflow-scrolling:touch}
.lesson pre code{background:none;border:0;color:inherit;padding:0}
.why{border-left:3px solid var(--s1);padding:2px 0 2px 11px;color:var(--ink2);
  font-size:14px;margin:0 0 11px}
.trap{background:color-mix(in oklab,var(--warn) 10%,var(--card));
  border-left:3px solid var(--warn);border-radius:0 9px 9px 0;padding:9px 12px;
  margin:11px 0;font-size:14px}
.trap b{color:var(--warn)}
.pat{background:color-mix(in oklab,var(--s1) 9%,var(--card));
  border-left:3px solid var(--s1);border-radius:0 9px 9px 0;padding:9px 12px;
  margin:11px 0;font-size:14px}
.pat b{color:var(--s1)}
.checks{background:var(--bg);border-radius:10px;padding:11px 13px;margin-top:11px}
.checks b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);display:block;margin-bottom:5px}
.checks ol{margin:0;padding-left:19px;font-size:14px;color:var(--ink2)}

/* tree */
details.mod{border:1px solid var(--grid);border-radius:12px;margin:8px 0;
  background:var(--card)}
details.mod>summary{padding:13px;cursor:pointer;list-style:none;display:grid;
  grid-template-columns:1fr auto;gap:6px;align-items:center}
details.mod>summary::-webkit-details-marker{display:none}
summary .mt{font-weight:600;font-size:14.5px}
summary .mp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
summary .mb{grid-column:1/-1;height:6px;background:var(--grid);border-radius:4px;
  overflow:hidden;margin-top:2px}
summary .mb i{display:block;height:100%}
.modbody{padding:0 11px 11px}
.msum{display:flex;gap:7px;padding:0 13px 12px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));
  transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:99;
  opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--grid);border-top-color:var(--s1);
  border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpibox{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:12px}
.kpibox b{display:block;font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpibox span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpibox em{font-style:normal;font-size:12px;color:var(--ink2);display:block;margin-top:3px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand"><i id="syncDot" class="off"></i>Auto-Me</div>
    <div class="kpi"><b id="kStreak">0</b><span>streak</span></div>
    <div class="kpi"><b id="kPct">0%</b><span>done</span></div>
    <button class="iconbtn" id="themeBtn" aria-label="Theme">◐</button>
  </div>
</header>

<div class="wrap">
  <section id="v-today"><div class="spin"></div></section>
  <section id="v-map" class="hide"></section>
  <section id="v-stats" class="hide"></section>
  <section id="v-set" class="hide"></section>
</div>

<nav class="bot">
  <button data-v="today" aria-selected="true"><b>◉</b>Today</button>
  <button data-v="map"><b>≡</b>Roadmap</button>
  <button data-v="stats"><b>▤</b>Progress</button>
  <button data-v="set"><b>⚙</b>Setup</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";
const REPO   = "taran-dev4u/learningHub";
const BRANCH = "main";
const BASE   = "auto-me";
const LS     = {tok:"autome.gh.token", prog:"autome.progress", theme:"autome.theme",
                tier:"autome.tier", rm:"autome.rmcache"};
const SR     = [1,3,7,16,35,90];
const CLOSED = new Set(["done","known","skipped"]);
const SLOT   = {dsa:"--s1",sd:"--s2",rtwk:"--s3",mock:"--s4",cs:"--s5",
                cloud:"--s6",ai:"--s7",bh:"--s8"};

let RM=null, PLAN=null, TUT={}, BY={}, TR={}, P=null, SHA=null, LATEST={};
let TIER = localStorage.getItem(LS.tier) || "target";
let VIEW = "today";
let saveTimer=null, syncing=false;

const $  = s=>document.querySelector(s);
const esc= s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col= t=>`var(${SLOT[t]||"--s1"})`;
const iso= d=>d.toISOString().slice(0,10);
const tok= ()=>localStorage.getItem(LS.tok)||"";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200);}
function dot(s){const d=$("#syncDot");d.className=s;}

/* ---------------- markdown ---------------- */
function md(t){
  if(!t) return "";
  const blocks=[];
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{
    blocks.push(c.replace(/\s+$/,"")); return `␀${blocks.length-1}␀`;});
  t = esc(t)
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
               '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out="",ul=false;
  for(const line of t.split("\n")){
    const s=line.trim();
    if(/^[-*]\s/.test(s)){ if(!ul){out+="<ul>";ul=true} out+=`<li>${s.slice(2)}</li>`; }
    else { if(ul){out+="</ul>";ul=false} if(s) out+=`<p>${s}</p>`; }
  }
  if(ul) out+="</ul>";
  return out.replace(/␀(\d+)␀/g,(m,i)=>`<pre><code>${esc(blocks[+i])}</code></pre>`);
}

/* ---------------- state ---------------- */
function blankProgress(){
  return {version:1,startedAt:iso(new Date()),
          streak:{current:0,best:0,lastActiveDay:null},items:{},history:{},notes:[]};
}
function statusOf(id){ return (P.items[id]||{}).s || ""; }

function mergeProgress(a,b){
  // newest per-item wins; streak takes the higher current
  const out=JSON.parse(JSON.stringify(a||blankProgress()));
  if(!b) return out;
  for(const [id,r] of Object.entries(b.items||{})){
    const cur=out.items[id];
    if(!cur || (r.d||"") > (cur.d||"")) out.items[id]=r;
  }
  for(const [d,h] of Object.entries(b.history||{})){
    const cur=out.history[d];
    if(!cur) out.history[d]=h;
    else cur.done=[...new Set([...(cur.done||[]),...(h.done||[])])];
  }
  const sa=out.streak||{},sb=b.streak||{};
  out.streak={current:Math.max(sa.current||0,sb.current||0),
              best:Math.max(sa.best||0,sb.best||0),
              lastActiveDay:[sa.lastActiveDay,sb.lastActiveDay].filter(Boolean).sort().pop()||null};
  out.savedAt=[a&&a.savedAt,b.savedAt].filter(Boolean).sort().pop();
  return out;
}

function touchStreak(){
  const s=P.streak=P.streak||{current:0,best:0,lastActiveDay:null};
  const today=iso(new Date());
  if(s.lastActiveDay===today) return;
  const prev=s.lastActiveDay?new Date(s.lastActiveDay+"T12:00:00"):null;
  const gap=prev?Math.round((new Date(today+"T12:00:00")-prev)/864e5):null;
  s.current=(gap===1)?s.current+1:1;
  s.best=Math.max(s.best||0,s.current);
  s.lastActiveDay=today;
}

function mark(id,st){
  const rec=P.items[id]||{}, today=iso(new Date());
  if(st==="reset") delete P.items[id];
  else if(st==="done"||st==="shaky"){
    const reps = st==="shaky"?1:(rec.reps||0)+1;
    const d=new Date(today+"T12:00:00"); d.setDate(d.getDate()+SR[Math.min(reps,SR.length)-1]);
    P.items[id]={s:"done",d:today,reps,next:iso(d),first:rec.first||today,
                 shaky:st==="shaky"||undefined};
    touchStreak();
  } else P.items[id]={s:st,d:today,first:rec.first||today};
  const h=P.history[today]=P.history[today]||{planned:[],done:[]};
  const set=new Set(h.done||[]); st==="reset"?set.delete(id):set.add(id);
  h.done=[...set];
  save();
}
function markMany(ids,st){
  const today=iso(new Date());
  ids.forEach(id=>{ const rec=P.items[id]||{};
    if(st==="reset") delete P.items[id];
    else P.items[id]={s:st,d:today,first:rec.first||today}; });
  if(st!=="reset") touchStreak();
  save(); render(); toast(`${ids.length} items marked ${st==="known"?"already known":st}`);
}

function save(){
  P.savedAt=new Date().toISOString();
  localStorage.setItem(LS.prog,JSON.stringify(P));
  header();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(push,2500);
}

/* ---------------- GitHub sync ---------------- */
const API=`https://api.github.com/repos/${REPO}/contents/${BASE}/state/progress.json`;
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));

async function pull(){
  if(!tok()) return null;
  try{
    const r=await fetch(`${API}?ref=${BRANCH}`,{cache:"no-store",
      headers:{Authorization:`Bearer ${tok()}`,Accept:"application/vnd.github+json"}});
    if(r.status===404){ SHA=null; return null; }
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); SHA=j.sha;
    return JSON.parse(b64d(j.content));
  }catch(e){ dot("err"); return null; }
}

async function push(){
  if(!tok()){ dot("off"); return; }
  if(syncing){ clearTimeout(saveTimer); saveTimer=setTimeout(push,1500); return; }
  syncing=true; dot("");
  try{
    for(let attempt=0;attempt<2;attempt++){
      const body={message:`auto-me: progress ${iso(new Date())}`,
                  content:b64e(JSON.stringify(P,null,2)),branch:BRANCH};
      if(SHA) body.sha=SHA;
      const r=await fetch(API,{method:"PUT",
        headers:{Authorization:`Bearer ${tok()}`,Accept:"application/vnd.github+json",
                 "Content-Type":"application/json"},body:JSON.stringify(body)});
      if(r.ok){ SHA=(await r.json()).content.sha; dot(""); syncing=false;
                $("#syncMsg")&&($("#syncMsg").textContent=
                  "Synced "+new Date().toLocaleTimeString()); return; }
      if(r.status===409||r.status===422){          // someone else committed
        const remote=await pull(); P=mergeProgress(P,remote);
        localStorage.setItem(LS.prog,JSON.stringify(P)); continue;
      }
      throw new Error(await r.text());
    }
    throw new Error("conflict");
  }catch(e){ dot("err"); $("#syncMsg")&&($("#syncMsg").textContent="Sync failed — will retry"); }
  finally{ syncing=false; }
}

/* ---------------- rendering ---------------- */
function refBlock(it,tut){
  const own=(it.res||[]).filter(r=>!r.guide);
  const guides=(it.res||[]).filter(r=>r.guide);
  const extra=(tut&&tut.refs)||[];
  const row=(r,primary)=>`<a class="ref${primary?" primary":""}" href="${esc(r.u)}"
      target="_blank" rel="noopener"><span class="rt">${esc(r.t||r.k)}</span>
      <span class="rk">${esc(r.k||"")}</span>
      ${r.why?`<span class="rw">${esc(r.why)}</span>`:""}</a>`;
  let h="";
  if(own.length||extra.length){
    h+=`<h4>Do this topic</h4>`;
    h+=own.map((r,i)=>row(r,i===0&&r.k==="practice")).join("");
    h+=extra.map(r=>row(r,false)).join("");
  }
  if(guides.length){
    h+=`<h4>Complete guides for this module</h4>`+guides.map(r=>row(r,false)).join("");
  }
  return h?`<div class="refs">${h}</div>`:"";
}

function itemCard(id,tier){
  const it=BY[id]; if(!it) return "";
  const t=(TUT.items||{})[id]||{};
  const on=CLOSED.has(statusOf(id));
  return `<div class="it${on?" done":""}" data-id="${esc(id)}">
    <div class="ihead" data-toggleopen>
      <div class="tick" data-act="toggle">✓</div>
      <div>
        <div class="ti">${tier?`<span class="tag t-${tier}">${tier}</span>`:""}${
          it.diff?`<span class="tag t-${it.diff}">${it.diff}</span>`:""}${esc(it.title)}</div>
        ${it.desc?`<div class="de">${esc(it.desc)}</div>`:""}
      </div>
    </div>
    <div class="ibody">
      ${t.why?`<div class="why">${md(t.why)}</div>`:""}
      ${t.teach?`<div class="lesson">${md(t.teach)}</div>`:""}
      ${t.example?`<div class="lesson">${md(t.example)}</div>`:""}
      ${it.pattern?`<div class="pat"><b>Pattern to imprint:</b> ${esc(it.pattern)}</div>`:""}
      ${t.trap?`<div class="trap"><b>The trap:</b> ${md(t.trap)}</div>`:""}
      ${t.checks?`<div class="checks"><b>You know this when you can answer</b><ol>${
        t.checks.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>`:""}
      ${refBlock(it,t)}
    </div>
    <div class="acts">
      <button class="btn sm" data-act="known">Already know it</button>
      <button class="btn sm" data-act="shaky">Shaky — repeat</button>
      ${it.url?`<a class="btn sm" href="${esc(it.url)}" target="_blank" rel="noopener">Open</a>`:""}
    </div>
  </div>`;
}

function renderToday(){
  const v=$("#v-today");
  if(!PLAN||!PLAN.sections){v.innerHTML=`<div class="empty">No plan yet. The 6:00 AM task will publish one.</div>`;return;}
  const pick=s=>TIER==="all"?s.items:s[TIER];
  let all=[],h="";
  const req=(PLAN.requiredCount||PLAN.counts.target), tierReq=PLAN.advanceOn||"target";
  const reqIds=[]; for(const s of PLAN.sections) reqIds.push(...(tierReq==="all"?s.items:s[tierReq]));
  const cleared=reqIds.filter(i=>CLOSED.has(statusOf(i))).length;
  const leftN=reqIds.length-cleared;
  const dayNo=PLAN.dayNumber||LATEST.dayNumber||1;
  const attempt=PLAN.attempt||LATEST.attempt||1;
  h+=`<div class="card">
     <h2>Day ${dayNo}${attempt>1?` <span class="pill">attempt ${attempt}</span>`:""}</h2>
     <div class="note">${esc(PLAN.weekday)}, ${esc(LATEST.servedOn||PLAN.date)} · ${
       TUT.headline?esc(TUT.headline):"Today's plan"}</div>
     ${leftN>0
       ? `<div class="pat" style="border-left-color:var(--warn);background:color-mix(in oklab,var(--warn) 10%,var(--card))">
            <b style="color:var(--warn)">Day ${dayNo} stays until it is finished.</b>
            ${cleared} of ${reqIds.length} cleared — <b>${leftN} left</b>.
            Day ${dayNo+1} does not open until every one of them is ticked.</div>`
       : `<div class="pat"><b>Day ${dayNo} complete.</b> Day ${dayNo+1} opens on the next 6&nbsp;AM run.</div>`}
     <div class="tiers" id="tiers">
       <button data-t="min">Min</button><button data-t="target">Target</button>
       <button data-t="stretch">Stretch</button><button data-t="all">All</button>
     </div>
     <div class="bar" style="margin-top:12px">
       <div class="lb"><span>Today</span><b id="tdVal">0 / 0</b></div>
       <div class="tr"><i class="fl" id="tdFill" style="background:var(--good);width:0"></i></div>
     </div>
     ${TUT.focus?`<div class="lesson" style="margin-top:8px">${md(TUT.focus)}</div>`:""}
   </div>`;
  for(const s of PLAN.sections){
    const ids=pick(s); if(!ids||!ids.length) continue;
    all=all.concat(ids);
    const dn=ids.filter(i=>CLOSED.has(statusOf(i))).length;
    h+=`<div class="card" style="border-left:4px solid ${col(s.track)}">
      <h2>${esc(s.title)}<span class="pill">${dn}/${ids.length}</span></h2>
      ${s.note?`<div class="note">${esc(s.note)}</div>`:""}`;
    let g=null;
    for(const id of ids){
      const it=BY[id]; if(!it) continue;
      const key=it.module+(it.sub?" › "+it.sub:"");
      if(key!==g){h+=`<div class="grp">${esc(key)}</div>`;g=key;}
      const tier=s.min.includes(id)?"MIN":s.target.includes(id)?"TGT":"STR";
      h+=itemCard(id,tier);
    }
    h+=`</div>`;
  }
  h+=`<div class="card" style="text-align:center">
      <button class="btn ok wide" id="closeDay">Mark everything above done</button>\n      <div class="note" style="margin:8px 0 0;text-align:center">Only a fully cleared day unlocks the next one.</div></div>`;
  v.innerHTML=h;
  document.querySelectorAll("#tiers button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.t===TIER));
  const dn=all.filter(i=>CLOSED.has(statusOf(i))).length;
  $("#tdVal").textContent=`${dn} / ${all.length}`;
  $("#tdFill").style.width=all.length?(100*dn/all.length)+"%":"0";
}

function renderMap(){
  const v=$("#v-map");
  if(!v.dataset.init){
    v.innerHTML=`<div class="card">
      <h2>Full roadmap</h2>
      <div class="note">Anything you already know — tap <b>Know all</b> on the module and it
        leaves your daily plan for good.</div>
      <div class="field"><select id="fTrack"><option value="">All tracks</option></select></div>
      <div class="field"><input type="search" id="fQ" placeholder="Search topics…"></div>
    </div><div id="mapBody"></div>`;
    const sel=$("#fTrack");
    RM.tracks.forEach(t=>{const o=document.createElement("option");
      o.value=t.id;o.textContent=t.title;sel.appendChild(o);});
    sel.onchange=renderMapBody;
    $("#fQ").oninput=e=>{clearTimeout(e.target._t);e.target._t=setTimeout(renderMapBody,220);};
    v.dataset.init="1";
  }
  renderMapBody();
}
function renderMapBody(){
  const ft=$("#fTrack").value, q=($("#fQ").value||"").toLowerCase().trim();
  let h="";
  for(const t of RM.tracks){
    if(ft&&t.id!==ft) continue;
    const items=RM.items.filter(i=>i.track===t.id);
    const mods=[],seen={};
    for(const i of items){ if(!(i.module in seen)){seen[i.module]=[];mods.push(i.module);} seen[i.module].push(i); }
    let th="";
    for(const m of mods){
      let list=seen[m];
      if(q) list=list.filter(i=>(i.title+" "+i.desc).toLowerCase().includes(q));
      if(!list.length) continue;
      const tot=seen[m].length;
      const dn=seen[m].filter(i=>statusOf(i.id)==="done").length;
      const kn=seen[m].filter(i=>["known","skipped"].includes(statusOf(i.id))).length;
      const pct=Math.round(100*(dn+kn)/tot);
      th+=`<details class="mod"${q?" open":""}>
        <summary><span class="mt">${esc(m)}</span><span class="mp">${dn+kn}/${tot}</span>
          <span class="mb"><i style="width:${pct}%;background:${col(t.id)}"></i></span></summary>
        <div class="msum">
          <button class="btn sm" data-bulk="known" data-t="${esc(t.id)}" data-m="${esc(m)}">Know all</button>
          <button class="btn sm" data-bulk="reset" data-t="${esc(t.id)}" data-m="${esc(m)}">Reset</button>
        </div>
        <div class="modbody">${list.slice(0,q?200:400).map(i=>itemCard(i.id,"")).join("")}</div>
      </details>`;
    }
    if(!th) continue;
    h+=`<div class="card" style="border-left:4px solid ${col(t.id)}">
      <h2>${esc(t.title)}<span class="pill">${items.length}</span></h2>
      <div class="note">${esc(t.blurb||"")}</div>${th}</div>`;
  }
  $("#mapBody").innerHTML=h||`<div class="empty">Nothing matches.</div>`;
}

function renderStats(){
  let all=0,dn=0,kn=0,bars="",byDay={};
  for(const [id,r] of Object.entries(P.items)) if(r.d) byDay[r.d]=(byDay[r.d]||0)+1;
  for(const t of RM.tracks){
    const ids=RM.items.filter(i=>i.track===t.id);
    const d=ids.filter(i=>statusOf(i.id)==="done").length;
    const k=ids.filter(i=>["known","skipped"].includes(statusOf(i.id))).length;
    all+=ids.length;dn+=d;kn+=k;
    const pd=100*d/ids.length,pk=100*k/ids.length;
    bars+=`<div class="bar"><div class="lb"><span>${esc(t.title)}</span>
      <b>${d+k}/${ids.length}</b></div>
      <div class="tr"><i class="fl" style="width:${pd}%;background:${col(t.id)}"></i>
      <i class="fl" style="width:${pk}%;background:${col(t.id)};opacity:.38"></i></div></div>`;
  }
  const cut=new Date();cut.setDate(cut.getDate()-30);
  const vel=Object.entries(byDay).filter(([d])=>new Date(d+"T12:00:00")>=cut)
                  .reduce((a,[,n])=>a+n,0);
  const left=all-dn-kn;
  let eta="—",etaSub="mark a few days first";
  if(vel>0){const days=Math.ceil(left/(vel/30));const e=new Date();
    e.setDate(e.getDate()+days);
    eta=e.toLocaleDateString(undefined,{month:"short",year:"numeric"});
    etaSub=`${left} left · ${(vel/30).toFixed(1)}/day`;}
  $("#v-stats").innerHTML=`
    <div class="card"><h2>Where you are</h2>
      <div class="kpis" style="margin-top:10px">
        <div class="kpibox"><span>Overall</span><b>${all?Math.round(100*(dn+kn)/all):0}%</b>
          <em>${dn+kn} of ${all}</em></div>
        <div class="kpibox"><span>Streak</span><b>${(P.streak||{}).current||0}</b>
          <em>best ${(P.streak||{}).best||0}</em></div>
        <div class="kpibox"><span>Last 30 days</span><b>${vel}</b><em>items closed</em></div>
        <div class="kpibox"><span>Finish by</span><b style="font-size:19px">${eta}</b>
          <em>${etaSub}</em></div>
      </div></div>
    <div class="card"><h2>By track</h2>
      <div class="note">Solid = done · faded = already known</div>${bars}</div>`;
}

function renderSet(){
  $("#v-set").innerHTML=`
   <div class="card">
     <h2>Sync across phone and laptop</h2>
     <div class="note">Your progress is committed to the
       <code>${REPO}</code> repo, so every device sees the same state and the
       6:00 AM task picks it up.</div>
     <div class="field">
       <label>GitHub token</label>
       <input type="password" id="ghTok" placeholder="github_pat_…" value="${esc(tok())}">
       <small>Create a <b>fine-grained</b> token at
         <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">
         github.com/settings/personal-access-tokens</a> →
         Repository access: <b>only <code>learningHub</code></b> →
         Permissions → Repository permissions → <b>Contents: Read and write</b>.
         Nothing else. The token is stored only in this browser, never in the page.</small>
     </div>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn pri" id="saveTok">Save &amp; sync now</button>
       <button class="btn" id="pullNow">Pull from GitHub</button>
     </div>
     <div class="note" id="syncMsg" style="margin-top:10px">${
       tok()?"Token saved.":"No token yet — progress is saved on this device only."}</div>
   </div>
   <div class="card">
     <h2>This device</h2>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn" id="expBtn">Export progress.json</button>
       <button class="btn" id="addHome">Add to home screen…</button>
     </div>
     <div class="note" style="margin-top:10px">On iPhone: Share → Add to Home Screen.
       On Android: menu → Add to Home screen. It then opens like an app.</div>
   </div>
   <div class="card">
     <h2>How this works</h2>
     <div class="note" style="font-size:14px;line-height:1.7">
       <p><b>Every day at 6:00 AM ET</b> a task picks the next unchecked item in every
       track, writes the lesson, emails it, and publishes it here.</p>
       <p><b>Three sizes.</b> Min is the never-break-the-streak floor. Target is a normal
       day. Stretch is if you have more in you. Min is a prefix of Target is a prefix of
       Stretch — stop anywhere, nothing is wasted.</p>
       <p><b>Nothing repeats.</b> Done or "already know it" leaves the daily feed for good.
       Everything you finish comes back on spaced repetition at 1, 3, 7, 16, 35 and 90 days.</p>
       <p><b>References.</b> Each item shows the specific links to do that topic, then the
       complete guides for the whole module — full books, full command references, official
       docs. Never a partial blog post.</p>
     </div>
   </div>`;
  $("#saveTok").onclick=async()=>{
    localStorage.setItem(LS.tok,$("#ghTok").value.trim());
    $("#syncMsg").textContent="Syncing…";
    const remote=await pull(); if(remote) P=mergeProgress(P,remote);
    await push(); render();
  };
  $("#pullNow").onclick=async()=>{
    const remote=await pull();
    if(remote){P=mergeProgress(P,remote);localStorage.setItem(LS.prog,JSON.stringify(P));
      render();toast("Pulled from GitHub.");}
    else toast("Nothing to pull.");
  };
  $("#expBtn").onclick=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:"application/json"}));
    a.download="progress.json";a.click();
  };
  $("#addHome").onclick=()=>toast("Use your browser's Share / menu → Add to Home Screen.");
}

function header(){
  let all=0,dn=0,kn=0;
  for(const i of RM.items){all++;const s=statusOf(i.id);
    if(s==="done")dn++;else if(s==="known"||s==="skipped")kn++;}
  $("#kStreak").textContent=(P.streak||{}).current||0;
  $("#kPct").textContent=(all?Math.round(100*(dn+kn)/all):0)+"%";
}
function render(){
  header();
  if(VIEW==="today") renderToday();
  else if(VIEW==="map") renderMap();
  else if(VIEW==="stats") renderStats();
  else renderSet();
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const nav=e.target.closest("nav.bot button");
  if(nav){
    VIEW=nav.dataset.v;
    document.querySelectorAll("nav.bot button").forEach(b=>
      b.setAttribute("aria-selected",b===nav));
    ["today","map","stats","set"].forEach(v=>
      $("#v-"+v).classList.toggle("hide",v!==VIEW));
    render(); window.scrollTo(0,0); return;
  }
  const tb=e.target.closest("#tiers button");
  if(tb){ TIER=tb.dataset.t; localStorage.setItem(LS.tier,TIER); renderToday(); return; }
  const bulk=e.target.closest("[data-bulk]");
  if(bulk){ e.preventDefault();
    const ids=RM.items.filter(i=>i.track===bulk.dataset.t&&i.module===bulk.dataset.m)
                      .map(i=>i.id);
    markMany(ids,bulk.dataset.bulk); return; }
  if(e.target.id==="closeDay"){
    const ids=[]; for(const s of PLAN.sections) ids.push(...(TIER==="all"?s.items:s[TIER]));
    ids.filter(i=>!CLOSED.has(statusOf(i))).forEach(i=>mark(i,"done"));
    render(); toast(`Day closed. Streak: ${P.streak.current}.`); return; }
  if(e.target.id==="themeBtn"){
    const dark=document.documentElement.dataset.theme==="dark";
    document.documentElement.dataset.theme=dark?"light":"dark";
    localStorage.setItem(LS.theme,dark?"light":"dark"); return; }

  const row=e.target.closest(".it"); if(!row) return;
  const act=e.target.closest("[data-act]");
  if(act){
    const id=row.dataset.id, a=act.dataset.act;
    if(a==="toggle") mark(id, CLOSED.has(statusOf(id))?"reset":"done");
    else if(a==="known") mark(id,"known");
    else if(a==="shaky"){ mark(id,"shaky"); toast("Back tomorrow."); }
    row.classList.toggle("done", CLOSED.has(statusOf(id)));
    if(VIEW==="today") renderToday();
    return;
  }
  if(e.target.closest("[data-toggleopen]")) row.classList.toggle("open");
});

/* ---------------- boot ---------------- */
async function boot(){
  const th=localStorage.getItem(LS.theme); if(th) document.documentElement.dataset.theme=th;
  try{ P=JSON.parse(localStorage.getItem(LS.prog))||blankProgress(); }
  catch(e){ P=blankProgress(); }

  const bust="?v="+Date.now();
  try{ LATEST=await (await fetch("./data/latest.json"+bust,{cache:"no-store"})).json(); }catch(e){ LATEST={}; }
  const day=LATEST.date||new Date().toISOString().slice(0,10);

  try{ RM=await (await fetch("./data/master-roadmap.json")).json(); }
  catch(e){ document.querySelector(".wrap").innerHTML=
    `<div class="empty">Could not load the roadmap.<br>Check that
     <code>${BASE}/data/master-roadmap.json</code> is published.</div>`; return; }
  BY=Object.fromEntries(RM.items.map(i=>[i.id,i]));
  TR=Object.fromEntries(RM.tracks.map(t=>[t.id,t]));

  try{ PLAN=await (await fetch(`./daily/${day}.plan.json`+bust,{cache:"no-store"})).json(); }catch(e){}
  try{ TUT =await (await fetch(`./daily/${day}.tutorial.json`+bust,{cache:"no-store"})).json(); }catch(e){ TUT={}; }

  if(tok()){ const remote=await pull(); if(remote){ P=mergeProgress(P,remote);
    localStorage.setItem(LS.prog,JSON.stringify(P)); } dot(""); }
  render();
}
boot();
</script>
</body>
</html>
