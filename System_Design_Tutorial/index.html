<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design Tutorial Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Highlight.js CSS for Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">🏗️</span>
            <h1>System Design Hub</h1>
        </div>
        <div class="nav-controls">
            <button id="theme-toggle" title="Toggle Theme">☀️ / 🌙</button>
            <button id="mobile-menu-btn" title="Menu">☰</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Curriculum</h2>
            </div>
            <nav id="topic-nav" class="topic-nav">
                <!-- Topics will be dynamically injected here -->
                <div class="loading-spinner">Loading topics...</div>
            </nav>
        </aside>

        <main class="content-area">
            <article id="markdown-content" class="markdown-body">
                <!-- Markdown content will be dynamically injected here -->
            </article>

            <div class="pagination-controls" id="pagination">
                <button id="btn-prev" class="btn btn-secondary">
                    <span class="arrow">←</span> Previous Topic
                </button>
                <button id="btn-next" class="btn btn-primary">
                    Next Topic <span class="arrow">→</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Libraries -->
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code syntax -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- DOMPurify to safely render HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <!-- App Logic -->
    <script src="contentBundle.js?v=5"></script>
    <script src="topics.js?v=5"></script>
    <script src="app.js?v=5"></script>
</body>
</html>
